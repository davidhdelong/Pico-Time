[platformio]
default_envs = esp32c6
src_dir = main

[env:esp32c6]
platform = espressif32@6.13.0
board = seeed_xiao_esp32c6
framework = espidf
upload_port = /dev/ttyACM0
upload_speed = 460800
monitor_speed = 115200
board_build.flash_mode = dio
board_build.partitions = partitions.csv
extra_scripts = pre:tools/private_config.py
build_flags =
    -DPPS_L76K_GPIO=0
    -DPPS_UBX_GPIO=1
    -DPPS_XIAO_ANTENNA_EXTERNAL=0
